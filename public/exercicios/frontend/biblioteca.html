<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minibiblioteca — exemplo de Frontend</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f6; color: #252b28; font: 1rem/1.6 system-ui, sans-serif; }
    header, main, footer { max-width: 48rem; margin-inline: auto; padding: 1.5rem; }
    header { border-bottom: 1px solid #dedfd7; }
    h1 { font: 2.5rem/1.2 Georgia, serif; }
    a { color: #24634e; }
    label { display: block; margin-bottom: .5rem; }
    input { width: 100%; padding: .8rem; border: 1px solid #626b63; border-radius: 4px; color: inherit; background: white; font: inherit; }
    :focus-visible { outline: 2px solid #24634e; outline-offset: 4px; }
    ul { padding: 0; list-style: none; }
    li { padding-block: 1rem; border-bottom: 1px solid #dedfd7; }
    footer { color: #5e655f; }
    @media (max-width: 30rem) { h1 { font-size: 2rem; } }
  </style>
</head>
<body>
  <header><nav aria-label="Principal"><a href="#notas">Ver notas</a></nav></header>
  <main>
    <h1>Minha biblioteca.</h1>
    <p>Um exemplo pequeno de HTML, CSS e JavaScript inspirado no Learning Notes.</p>
    <label for="busca">Buscar nas notas</label>
    <input id="busca" type="search" placeholder="Ex.: HTML ou pagina" aria-controls="notas">
    <p id="resultado" role="status"></p>
    <noscript>A busca precisa de JavaScript. Todas as notas estão disponíveis abaixo.</noscript>
    <section id="notas" aria-labelledby="titulo-notas">
      <h2 id="titulo-notas">Notas de estudo</h2>
      <ul>
        <li>HTML: estrutura da página</li>
        <li>CSS: cores e espaçamento</li>
        <li>JavaScript: eventos e busca</li>
      </ul>
    </section>
  </main>
  <footer>Exercício didático. Abre este arquivo no editor para mudar e testar.</footer>
  <script>
    const busca = document.querySelector('#busca');
    const notas = [...document.querySelectorAll('#notas li')];
    const resultado = document.querySelector('#resultado');
    const normalizar = texto => texto.normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '').toLowerCase();
    function filtrar() {
      const termo = normalizar(busca.value.trim());
      let visiveis = 0;
      for (const nota of notas) {
        const corresponde = normalizar(nota.textContent).includes(termo);
        nota.hidden = !corresponde;
        if (corresponde) visiveis++;
      }
      resultado.textContent = visiveis === 0
        ? 'Nenhuma nota encontrada. Tenta outro termo.'
        : `${visiveis} nota(s) encontrada(s).`;
    }
    busca.addEventListener('input', filtrar);
    filtrar();
  </script>
</body>
</html>
